version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: classmates-db
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: classmates
      POSTGRES_USER: classmates
      POSTGRES_PASSWORD: classmates_secret
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U classmates -d classmates"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: classmates-web
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DATABASE_URL: postgres://classmates:classmates_secret@db:5432/classmates
      DEBUG: "true"

volumes:
  pgdata:
