{% extends "core/base.html" %}
{% load static %}

{% block title %}登录 - 同窗录{% endblock %}

{% block content %}
<div class="container" style="padding-top: 60px; padding-bottom: 80px;">
    <div class="animate-fade-in" style="max-width: 420px; margin: 0 auto;">
        <div class="card">
            <div style="text-align: center; margin-bottom: var(--space-xl);">
                <div style="width: 64px; height: 64px; border-radius: var(--radius-lg); background: linear-gradient(135deg, var(--color-primary), var(--color-primary-light)); display: flex; align-items: center; justify-content: center; margin: 0 auto var(--space-lg); box-shadow: 4px 4px 12px rgba(225,29,72,0.3);">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                </div>
                <h1 style="font-size: 1.75rem;">欢迎回来</h1>
                <p style="color: var(--color-foreground-light); opacity: 0.7; margin-top: var(--space-sm);">登录你的同窗录账号</p>
            </div>

            <form method="post" action="{% url 'login' %}">
                {% csrf_token %}

                <div class="form-group">
                    <label class="form-label" for="email">邮箱 <span class="required">*</span></label>
                    <input type="email" id="email" name="email" class="form-input" placeholder="请输入注册邮箱" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">密码 <span class="required">*</span></label>
                    <input type="password" id="password" name="password" class="form-input" placeholder="请输入密码" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn btn-primary btn-lg btn-block mt-lg animate-scale-in">
                    登 录
                </button>
            </form>

            <div style="text-align: center; margin-top: var(--space-xl);">
                <p class="text-sm" style="opacity: 0.7;">
                    还没账号？
                    <a href="{% url 'register' %}" style="font-weight: 600;">去注册</a>
                </p>
            </div>
        </div>

        <!-- Decorative text -->
        <div style="text-align: center; margin-top: var(--space-xl); opacity: 0.4;">
            <p class="text-xs">记录青春 · 珍藏同窗情谊</p>
        </div>
    </div>
</div>
{% endblock %}
